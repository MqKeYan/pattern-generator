    <!-- 脚本 -->
    <!-- 页面渲染前恢复上次标签位置，刷新时完全保持位置不变 -->
    <script>
        (function () {
            document.body.classList.add('is-initializing');
            const pathTabs = {'/': 'tab-2d', '/2d': 'tab-2d', '/3d': 'tab-3d', '/animation': 'tab-anim', '/settings': null, '/pushplus': null};
            const savedTab = pathTabs[location.pathname] || sessionStorage.getItem('active_tab');
            if (savedTab && document.getElementById(savedTab)) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === savedTab));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === savedTab));
            }
        })();
    </script>
    <!-- 服务端内联配置：主界面初始化时同步读取，刷新首帧即渲染完整侧边栏 -->
    <script>
        window.INIT_CONFIG = {{ init_config | tojson }};
    </script>
