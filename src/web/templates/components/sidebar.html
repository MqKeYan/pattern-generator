        <!-- ===== 左侧控制面板 ===== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="app-title" data-i18n="app_title">斑图形成可视化系统</h1>
                <button class="mobile-sidebar-toggle" type="button" data-mobile-sidebar-toggle aria-controls="sidebar" aria-expanded="false">参数与控制</button>
                <div class="client-card">
                    <div class="status-grid" id="info-grid">
                        <span class="status-k" data-i18n="info_version">软件版本</span><span class="status-v" data-i18n="loading">加载中...</span>
                        <span class="status-k" data-i18n="info_client_id">客户端号</span><span class="status-v" data-i18n="loading">加载中...</span>
                        <span class="status-k" data-i18n="info_python">Python 版本</span><span class="status-v" data-i18n="loading">加载中...</span>
                        <span class="status-k" data-i18n="info_cuda">CUDA 版本</span><span class="status-v" data-i18n="loading">加载中...</span>
                        <span class="status-k" data-i18n="info_pytorch">Pytorch 版本</span><span class="status-v" data-i18n="loading">加载中...</span>
                        <span class="status-k" data-i18n="info_cpu">CPU 型号</span><span class="status-v" data-i18n="loading">加载中...</span>
                        <span class="status-k" data-i18n="info_gpu">GPU 型号</span><span class="status-v" data-i18n="loading">加载中...</span>
                        <span class="status-k" data-i18n="info_hardware">计算硬件</span><span class="status-v" data-i18n="loading">加载中...</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-scroll">
                <!-- 模型选择 -->
                <section class="panel-card">
                    <h3 class="card-title" data-i18n="model_select">模型选择</h3>
                    <div class="custom-select" id="model-select">
                        <div class="custom-select-trigger">
                            <span class="selected-text">模型1·R-M型</span>
                        </div>
                        <div class="custom-select-options"></div>
                    </div>
                </section>

                <!-- 参数设置 -->
                <section class="panel-card">
                    <h3 class="card-title" data-i18n="params_setting">参数设置</h3>
                    <div id="params-container"></div>
                    <button class="btn btn-outline btn-danger" id="reset-params" data-impact="caution" data-i18n="reset_params">重置参数</button>
                </section>

                <!-- 初始值范围 -->
                <section class="panel-card">
                    <h3 class="card-title" data-i18n="init_range">初始值范围</h3>
                    <p class="init-desc" id="init-desc"></p>
                    <div class="init-grid">
                        <label data-i18n="x_min">X 最小值</label>
                        <input type="number" id="x-min" step="0.01" class="num-input">
                        <label data-i18n="x_max">X 最大值</label>
                        <input type="number" id="x-max" step="0.01" class="num-input">
                        <label data-i18n="y_min">Y 最小值</label>
                        <input type="number" id="y-min" step="0.01" class="num-input">
                        <label data-i18n="y_max">Y 最大值</label>
                        <input type="number" id="y-max" step="0.01" class="num-input">
                    </div>
                    <button class="btn btn-outline btn-info" id="apply-best-init" data-impact="normal" data-i18n="apply_best_init">应用最佳初始值</button>
                </section>

                <!-- 跟踪点设置 -->
                <section class="panel-card">
                    <h3 class="card-title" data-i18n="track_points">时间演化跟踪点</h3>
                    <div class="track-inputs">
                        <label data-i18n="coord_x">X坐标</label>
                        <input type="number" id="track-x" value="50" min="0" max="99" class="num-input">
                        <label data-i18n="coord_y">Y坐标</label>
                        <input type="number" id="track-y" value="50" min="0" max="99" class="num-input">
                    </div>
                    <div class="btn-row">
                        <button class="btn btn-outline btn-primary" id="add-track" data-impact="normal" data-i18n="add">添加</button>
                        <button class="btn btn-outline btn-danger" id="clear-track" data-impact="caution" data-i18n="clear">清空</button>
                    </div>
                    <ul class="track-list" id="track-list" data-i18n="track_list_center">当前跟踪点: 中心点(50,50)</ul>
                </section>

                <!-- 迭代次数 -->
                <section class="panel-card">
                    <h3 class="card-title" data-i18n="iterations">迭代次数</h3>
                    <div class="range-container">
                        <input type="range" id="iter-range" min="1" max="50000" value="9000" class="range-input">
                        <input type="number" id="iter-value" value="9000" min="1" max="50000" class="num-input num-inline">
                    </div>
                    <button class="btn btn-outline btn-info" id="reset-iters" data-impact="normal" data-i18n="reset_iters">应用推荐值</button>
                </section>

                <!-- 动画设置 -->
                <section class="panel-card">
                    <h3 class="card-title" data-i18n="anim_setting">动画设置</h3>
                    <div class="init-grid">
                        <label data-i18n="anim_start">起始迭代</label>
                        <input type="number" id="anim-start" value="0" min="0" class="num-input">
                        <label data-i18n="anim_end">结束迭代</label>
                        <input type="number" id="anim-end" value="300" min="1" max="20000" class="num-input">
                        <label data-i18n="anim_frames">帧数</label>
                        <input type="number" id="anim-frames" value="300" min="1" max="1000" class="num-input">
                    </div>
                </section>

                <!-- 控制面板 -->
                <section class="panel-card control-section">
                    <h3 class="card-title" data-i18n="control_panel">控制面板</h3>
                    <button class="btn btn-outline btn-success" id="run-sim" data-impact="normal" data-i18n="run_sim">
                        运行模拟
                    </button>
                    <button class="btn btn-outline btn-success" id="run-anim" data-impact="normal" data-i18n="run_anim">
                        开始动画
                    </button>
                    <button class="btn btn-outline btn-danger" id="reset-all" data-impact="caution" data-i18n="reset_all">
                        重置所有
                    </button>
                    <button class="btn btn-outline btn-danger" id="clean-cache" data-impact="caution" data-i18n="clean_cache">
                        清理缓存
                    </button>
                    <button class="btn btn-outline btn-white" id="software-settings" data-impact="low" data-i18n="software_settings">
                        软件设置
                    </button>
                    <button class="status-text status-log-trigger" id="status-msg" type="button" data-i18n="status_ready" aria-haspopup="dialog">就绪，请选择参数运行模拟</button>
                </section>
            </div>
        </aside>
