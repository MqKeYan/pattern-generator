
            <!-- 8. 系统设置 -->
            <div class="tab-panel" id="tab-settings">
                <section class="panel-card settings-card">
                    <h3 class="card-title">启动与服务</h3>
                    <div class="form-grid settings-form-grid startup-settings-grid">
                        <label>主服务端口</label><input type="number" id="set-port" class="num-input">
                        <label>后台服务端口</label><input type="number" id="set-admin-port" class="num-input">
                        <label class="settings-checkbox"><input type="checkbox" id="set-auto-browser"><span>主界面自动打开浏览器</span></label>
                        <label class="settings-checkbox"><input type="checkbox" id="set-auto-admin-browser"><span>后台自动打开浏览器</span></label>
                    </div>
                    <div class="settings-actions">
                        <button class="btn btn-outline btn-danger" data-settings-reset-section="startup" data-impact="caution">恢复默认设置</button>
                    </div>
                </section>
                <section class="panel-card settings-card">
                    <h3 class="card-title">监控设置</h3>
                    <div class="form-grid settings-form-grid">
                        <label>默认监控视图</label>
                        <div class="custom-select" id="set-monitor-default-view" value="full">
                            <div class="custom-select-trigger"><span class="selected-text">完整视图</span></div>
                            <div class="custom-select-options">
                                <div class="custom-select-option selected" data-value="full">完整视图</div>
                                <div class="custom-select-option" data-value="compact">紧凑视图</div>
                            </div>
                        </div>
                    </div>
                    <div class="settings-actions">
                        <button class="btn btn-outline btn-danger" data-settings-reset-section="monitor" data-impact="caution">恢复默认设置</button>
                    </div>
                </section>
                <section class="panel-card settings-card">
                    <h3 class="card-title">任务与调度</h3>
                    <div class="form-grid settings-form-grid task-settings-grid">
                        <label>最大并发数</label><input type="number" id="set-concurrency" class="num-input">
                        <label>GPU 显存预留（MB）</label><input type="number" id="set-reserve" class="num-input">
                        <label>任务超时时间（秒）</label><input type="number" id="set-timeout" class="num-input">
                        <label>任务失败重试次数</label><input type="number" id="set-retry" class="num-input">
                        <label>请求频率限制（次/窗口）</label><input type="number" id="set-rate-limit" class="num-input">
                        <label>请求频率窗口（秒）</label><input type="number" id="set-rate-window" class="num-input">
                        <label>任务结果保留（分钟）</label><input type="number" id="set-result-ttl" class="num-input">
                        <label>全局缓存上限（MB）</label><input type="number" id="set-cache-limit" class="num-input">
                    </div>
                    <div class="settings-actions">
                        <button class="btn btn-outline btn-danger" data-settings-reset-section="task" data-impact="caution">恢复默认设置</button>
                    </div>
                </section>
                <div class="settings-actions settings-global-actions">
                    <button class="btn btn-outline btn-success" data-settings-save-all data-impact="normal">保存全部设置</button>
                    <button class="btn btn-outline btn-danger" data-settings-reset-all data-impact="caution">恢复全部默认</button>
                </div>
            </div>
